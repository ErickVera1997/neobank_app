name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: neobank_core (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/neobank_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  api:
    name: neobank_api (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/neobank_api
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  mobile:
    name: neobank_mobile (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/neobank_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test